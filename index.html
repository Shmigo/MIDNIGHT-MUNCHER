<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight Muncher</title>
<style>
:root{--bg:#efeaf7;--ink:#241b3a;--dim:#6b6283;--btn:#d9d0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0918;--ink:#f1ecff;--dim:#9a90b8;--btn:#2a2145;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0918;--ink:#f1ecff;--dim:#9a90b8;--btn:#2a2145;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
h1{font-size:1.25rem;margin:4px 0 8px;letter-spacing:.04em}
#wrap{width:min(94vw,calc(100vh - 230px),520px);min-width:260px}
#hud{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;font-variant-numeric:tabular-nums}
#hud span{color:var(--dim);font-weight:400;margin-right:4px}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:10px;background:#120d1f;touch-action:none}
#hint{color:var(--dim);font-size:.85rem;margin:8px 0;text-align:center}
#pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;margin-top:4px}
#pad button{background:var(--btn);color:var(--ink);border:0;border-radius:10px;font-size:1.4rem}
#pad button:focus-visible,canvas:focus-visible{outline:3px solid #ffb02e}
@media (pointer:coarse){#pad{display:grid}}
</style></head><body>
<h1>Midnight Muncher</h1>
<div id="wrap">
<div id="hud"><div><span>Score</span><b id="sc">0</b></div><div><span>Best</span><b id="bs">0</b></div><div><span>Level</span><b id="lv">1</b></div><div id="li"></div></div>
<canvas id="c" tabindex="0" aria-label="Game board"></canvas>
</div>
<div id="hint">Arrow keys or WASD to move. P pauses. On touch, swipe the board or use the pad.</div>
<div id="pad"><span></span><button data-d="0" aria-label="Up">▲</button><span></span><button data-d="1" aria-label="Left">◀</button><button data-d="2" aria-label="Down">▼</button><button data-d="3" aria-label="Right">▶</button></div>
<script>
const M=["###################","#........#........#","#o##.###.#.###.##o#","#.................#","#.##.#.#####.#.##.#","#....#...#...#....#","####.###.#.###.####","####.#.......#.####","####.#.##-##.#.####","    ...#GGG#...    ","####.#.#####.#.####","####.#.......#.####","####.###.#.###.####","#....#...#...#....#","#.##.#.#####.#.##.#","#........P........#","#o##.###.#.###.##o#","#........#........#","###################"];
const T=24,W=19,H=19,DIRS=[[0,-1],[-1,0],[0,1],[1,0]];
const COL=['#ff5d73','#ff9ecf','#4fd8e8','#ffb454'],CORN=[[17,1],[1,1],[17,17],[1,17]];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W*T*2;cv.height=H*T*2;ctx.scale(2,2);
const $=id=>document.getElementById(id);
let pel,left,score=0,best=0,lives,level=1,state='title',tmr=0,fr=0,combo=0,modeT=0,P,G,want=[0,0],clock=0,paused=false;
try{best=+localStorage.getItem('mm-best')||0}catch(e){}
const wx=x=>(x+W)%W;
function open(x,y,door){if(y<0||y>=H)return false;const c=M[y][wx(x)];if(c==='#')return false;if(c==='-'||c==='G')return door;return true}
function loadLevel(){pel=M.map(r=>[...r].map(c=>c==='.'?1:c==='o'?2:0));left=pel.flat().filter(Boolean).length;resetPos();}
function resetPos(){P={tx:9,ty:15,dx:0,dy:0,p:0,fx:-1,fy:0};want=[0,0];fr=0;combo=0;modeT=0;
 G=[0,1,2,3].map(i=>({id:i,tx:[9,8,9,10][i],ty:i?9:7,dx:i?0:-1,dy:0,p:0,state:i?'house':'normal',rel:[0,2,4.5,7][i],corner:CORN[i],fr:false,eatT:0}))}
function newGame(){score=0;lives=3;level=1;loadLevel();state='ready';tmr=1.6;hud()}
function hud(){$('sc').textContent=score;$('bs').textContent=best;$('lv').textContent=level;$('li').textContent='●'.repeat(Math.max(lives,0)).split('').join(' ')}
function reverse(e){if(e.dx||e.dy){e.tx=wx(e.tx+e.dx);e.ty+=e.dy;e.p=1-e.p;e.dx*=-1;e.dy*=-1}}
function step(e,sp,dt,ch){if(!e.dx&&!e.dy)return;e.p+=sp*dt;while(e.p>=1){e.p-=1;e.tx=wx(e.tx+e.dx);e.ty+=e.dy;ch(e);if(!e.dx&&!e.dy){e.p=0;break}}}
function pChoose(e){if(open(e.tx+want[0],e.ty+want[1],false)&&(want[0]||want[1])){e.dx=want[0];e.dy=want[1]}else if(!open(e.tx+e.dx,e.ty+e.dy,false)){e.dx=e.dy=0}if(e.dx||e.dy){e.fx=e.dx;e.fy=e.dy}}
function target(g){if(g.state==='eaten')return[9,9];if(g.state==='leaving')return[9,6];
 if(modeT%27<7)return g.corner;const d=Math.hypot(g.tx-P.tx,g.ty-P.ty);
 if(g.id===0)return[P.tx,P.ty];if(g.id===1)return[P.tx+4*P.fx,P.ty+4*P.fy];
 if(g.id===2)return[2*(P.tx+2*P.fx)-G[0].tx,2*(P.ty+2*P.fy)-G[0].ty];return d>6?[P.tx,P.ty]:g.corner}
function gChoose(g){
 if(g.state==='leaving'&&g.tx===9&&g.ty===7)g.state='normal';
 if(g.state==='eaten'&&g.tx===9&&g.ty===9){g.state='house';g.rel=1.2;g.dx=g.dy=0;return}
 const door=g.state!=='normal';
 let o=DIRS.filter(([x,y])=>!(x===-g.dx&&y===-g.dy)&&open(g.tx+x,g.ty+y,door));
 if(!o.length)o=DIRS.filter(([x,y])=>open(g.tx+x,g.ty+y,door));
 if(!o.length){g.dx=g.dy=0;return}
 let b;if(g.fr&&g.state==='normal')b=o[Math.floor(Math.random()*o.length)];
 else{const t=target(g);b=o.reduce((a,d)=>Math.hypot(g.tx+d[0]-t[0],g.ty+d[1]-t[1])<Math.hypot(g.tx+a[0]-t[0],g.ty+a[1]-t[1])?d:a)}
 g.dx=b[0];g.dy=b[1]}
const pos=e=>[e.tx+e.dx*e.p,e.ty+e.dy*e.p];
function update(dt){
 const sm=1+.04*Math.min(level-1,8);modeT+=dt;
 if(fr>0){fr-=dt;if(fr<=0){fr=0;G.forEach(g=>g.fr=false)}}
 if(!P.dx&&!P.dy&&(want[0]||want[1])&&open(P.tx+want[0],P.ty+want[1],false)){P.dx=want[0];P.dy=want[1];P.fx=P.dx;P.fy=P.dy}
 if((want[0]&&want[0]===-P.dx)||(want[1]&&want[1]===-P.dy))reverse(P),P.fx=P.dx,P.fy=P.dy;
 step(P,6.6*sm,dt,pChoose);
 const[px,py]=pos(P),nx=wx(Math.round(px)),ny=Math.round(py);
 if(pel[ny]&&pel[ny][nx]){const v=pel[ny][nx];pel[ny][nx]=0;left--;score+=v===2?50:10;
  if(v===2){fr=Math.max(2.5,7-level*.8);combo=0;G.forEach(g=>{if(g.state==='normal'&&!g.fr){g.fr=true;reverse(g)}else if(g.state==='leaving')g.fr=true})}
  if(score>best){best=score;try{localStorage.setItem('mm-best',best)}catch(e){}}hud()}
 for(const g of G){
  if(g.state==='house'){g.rel-=dt;if(g.rel<=0){g.state='leaving';g.tx=9;g.ty=9;g.dx=0;g.dy=-1;g.p=0}continue}
  if(g.state==='eaten'){g.eatT+=dt;if(g.eatT>14){g.state='house';g.rel=1;g.tx=9;g.ty=9;g.dx=g.dy=0;g.p=0;g.eatT=0;continue}}
  if(!g.dx&&!g.dy)gChoose(g);
  step(g,(g.state==='eaten'?11:g.fr?3.6:5.8*sm),dt,gChoose);
  const[gx,gy]=pos(g);
  if(g.state!=='eaten'&&Math.hypot(gx-px,gy-py)<.6){
   if(g.fr){g.state='eaten';g.fr=false;g.eatT=0;score+=200*2**combo;combo++;hud()}
   else{state='dying';tmr=1.5;lives--;hud();return}}
 }
 if(left<=0){state='won';tmr=1.8}
}
function tick(dt){
 clock+=dt;if(paused)return;
 if(state==='ready'){tmr-=dt;if(tmr<=0)state='play'}
 else if(state==='play')update(dt);
 else if(state==='dying'){tmr-=dt;if(tmr<=0){if(lives>0){resetPos();state='ready';tmr=1.5}else state='over'}}
 else if(state==='won'){tmr-=dt;if(tmr<=0){level++;loadLevel();state='ready';tmr=1.6;hud()}}
}
function wrapDraw(x,f){f(x);if(x<1)f(x+W);if(x>W-2)f(x-W)}
function draw(){
 ctx.fillStyle='#120d1f';ctx.fillRect(0,0,W*T,H*T);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=M[y][x];
  if(c==='#'){ctx.fillStyle='#21183d';ctx.fillRect(x*T,y*T,T,T);ctx.strokeStyle='#8b6bff';ctx.lineWidth=2;ctx.beginPath();
   DIRS.forEach(([dx,dy])=>{const a=x+dx,b=y+dy;if(a<0||b<0||a>=W||b>=H||M[b][a]==='#')return;
    const cx=x*T+T/2+dx*(T/2-1),cy=y*T+T/2+dy*(T/2-1);ctx.moveTo(cx-Math.abs(dy)*T/2,cy-Math.abs(dx)*T/2);ctx.lineTo(cx+Math.abs(dy)*T/2,cy+Math.abs(dx)*T/2)});ctx.stroke()}
  else if(c==='-'){ctx.fillStyle='#ff9ecf';ctx.fillRect(x*T,y*T+T/2-2,T,4)}
  else if(pel&&pel[y][x]){ctx.fillStyle=pel[y][x]===2?'#ff8fa3':'#ffe9b0';ctx.beginPath();ctx.arc(x*T+T/2,y*T+T/2,pel[y][x]===2?4+1.5*Math.sin(clock*8):2,0,7);ctx.fill()}}
 if(!P)return;
 const[px,py]=pos(P);
 if(state!=='dying'||tmr>0){wrapDraw(px,x=>{const cx=x*T+T/2,cy=py*T+T/2;let m=.12+.3*Math.abs(Math.sin(clock*14));if(!P.dx&&!P.dy)m=.15;
  let a=Math.atan2(P.fy,P.fx);if(state==='dying'){m=Math.min(Math.PI,(1-tmr/1.5)*Math.PI)}
  ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,10,a+m,a-m+Math.PI*2);ctx.closePath();ctx.fill()})}
 if(state==='dying')return;
 for(const g of G){const[gx,gy]=pos(g);const blink=fr>0&&fr<2&&Math.floor(clock*6)%2;
  wrapDraw(gx,x=>{const cx=x*T+T/2,cy=gy*T+T/2+(g.state==='house'?Math.sin(clock*6+g.id)*2:0);
   if(g.state!=='eaten'){ctx.fillStyle=g.fr?(blink?'#fff':'#3b4ccf'):COL[g.id];ctx.beginPath();ctx.arc(cx,cy-1,10,Math.PI,0);ctx.lineTo(cx+10,cy+10);
    for(let i=0;i<3;i++){ctx.lineTo(cx+10-i*6.7-3.3,cy+6);ctx.lineTo(cx+10-(i+1)*6.7,cy+10)}ctx.closePath();ctx.fill()}
   for(const s of[-4,4]){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+s,cy-3,3.2,0,7);ctx.fill();ctx.fillStyle=g.fr&&g.state!=='eaten'?'#ffd1d1':'#1b1240';ctx.beginPath();ctx.arc(cx+s+g.dx*1.5,cy-3+g.dy*1.5,1.6,0,7);ctx.fill()}})}
 ctx.textAlign='center';ctx.fillStyle='#fff';
 const say=(t,s,y=H*T/2+T*1.5)=>{ctx.font='bold 22px "Trebuchet MS",sans-serif';ctx.fillStyle='#ffb02e';ctx.fillText(t,W*T/2,y);if(s){ctx.font='13px "Trebuchet MS",sans-serif';ctx.fillStyle='#f1ecff';ctx.fillText(s,W*T/2,y+22)}};
 if(state==='ready')say('Ready');
 if(state==='won')say('Level clear');
 if(paused)say('Paused','Press P to resume');
}
function overlay(){
 if(state==='title'||state==='over'){ctx.fillStyle='rgba(13,9,24,.82)';ctx.fillRect(0,0,W*T,H*T);ctx.textAlign='center';
  ctx.font='bold 34px "Trebuchet MS",sans-serif';ctx.fillStyle='#ffb02e';ctx.fillText(state==='over'?'Game over':'Midnight',W*T/2,170);
  if(state==='title')ctx.fillText('Muncher',W*T/2,206);else{ctx.font='18px "Trebuchet MS",sans-serif';ctx.fillStyle='#f1ecff';ctx.fillText('Score '+score,W*T/2,206)}
  ctx.font='15px "Trebuchet MS",sans-serif';ctx.fillStyle='#f1ecff';ctx.fillText('Eat every dot. Dodge the wisps.',W*T/2,252);ctx.fillText('Big dots turn the wisps blue.',W*T/2,274);
  ctx.fillStyle='#ff9ecf';ctx.fillText(state==='over'?'Press any key or tap to play again':'Press any key or tap to start',W*T/2,320)}
}
function setWant(i){want=DIRS[i];if(state==='title'||state==='over')newGame()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();const m={arrowup:0,w:0,arrowleft:1,a:1,arrowdown:2,s:2,arrowright:3,d:3}[k];
 if(m!==undefined){e.preventDefault();setWant(m)}else if(k==='p'&&(state==='play'||state==='ready'))paused=!paused;
 else if(state==='title'||state==='over'){if(k.length===1||k==='enter')newGame()}});
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setWant(+b.dataset.d)}));
let t0;cv.addEventListener('pointerdown',e=>{t0=[e.clientX,e.clientY];if(state==='title'||state==='over')newGame()});
cv.addEventListener('pointerup',e=>{if(!t0)return;const dx=e.clientX-t0[0],dy=e.clientY-t0[1];t0=null;if(Math.hypot(dx,dy)<20)return;
 setWant(Math.abs(dx)>Math.abs(dy)?(dx<0?1:3):(dy<0?0:2))});
let last=performance.now();loadLevel();hud();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;tick(dt);draw();overlay();requestAnimationFrame(loop)})(last);
</script></body></html>
